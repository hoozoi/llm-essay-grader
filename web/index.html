<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LLM Essay Grader</title>
<link rel="stylesheet" href="fonts/ibm-plex-sans-kr/400.css">
<link rel="stylesheet" href="fonts/ibm-plex-sans-kr/500.css">
<link rel="stylesheet" href="fonts/ibm-plex-sans-kr/600.css">
<link rel="stylesheet" href="fonts/newsreader/400.css">
<link rel="stylesheet" href="fonts/newsreader/400-italic.css">
<link rel="stylesheet" href="fonts/nanum-pen-script/400.css">
<style>
  :root {
    --desk: #dfe5eb;
    --paper: #ffffff;
    --rule: #cddcec;
    --margin-line: #e2827d;
    --ink: #1e2b3a;
    --ink-soft: #5d6b7a;
    --pen: #cf2f2a;
    --line: 30px;
    --sans: "IBM Plex Sans KR", system-ui, sans-serif;
    --serif: "Newsreader", Georgia, serif;
    --hand: "Nanum Pen Script", cursive;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--desk);
    color: var(--ink);
    font: 15px/1.6 var(--sans);
    min-height: 100vh;
    word-break: keep-all; overflow-wrap: break-word;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 48px 24px 64px; }

  header {
    margin-bottom: 30px;
  }
  h1 {
    font: 500 56px/1 var(--serif); letter-spacing: -0.02em;
    margin: 0 0 14px; color: var(--ink);
  }
  .lede { margin: 0 0 6px; font-size: 16px; color: var(--ink); max-width: 720px; }
  .task { margin: 0; color: var(--ink-soft); font-size: 14px; max-width: 720px; }
  details { margin-top: 8px; color: var(--ink-soft); font-size: 14px; }
  summary { cursor: pointer; width: fit-content; }
  details p { font-family: var(--serif); font-size: 16px; line-height: 1.55; max-width: 64ch; color: var(--ink); }

  .sheet {
    position: relative;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 300px;
    background: var(--paper);
    border-radius: 3px;
    box-shadow: 0 1px 0 rgba(30, 43, 58, .06), 0 18px 40px -24px rgba(30, 43, 58, .45);
  }
  .sheet::before {             /* 아래에 깔린 두 번째 답안지 */
    content: ""; position: absolute; inset: 6px -6px -6px 6px; z-index: -1;
    background: #f7f9fb; border-radius: 3px;
    box-shadow: 0 10px 24px -20px rgba(30, 43, 58, .5);
  }

  .page { position: relative; border-right: 1px solid #edf1f5; }
  textarea {
    --margin-x: 54px;
    display: block; width: 100%; height: calc(var(--line) * 26 + 72px);
    border: 0; outline: 0; resize: none; overflow-y: auto; margin: 0;
    padding: 36px 32px 36px 80px;
    font: 17px/var(--line) var(--serif); color: var(--ink);
    background-color: transparent;
    background-image:
      linear-gradient(to right, transparent var(--margin-x), var(--margin-line) var(--margin-x), var(--margin-line) calc(var(--margin-x) + 1px), transparent calc(var(--margin-x) + 1px), transparent calc(var(--margin-x) + 4px), var(--margin-line) calc(var(--margin-x) + 4px), var(--margin-line) calc(var(--margin-x) + 5px), transparent calc(var(--margin-x) + 5px)),
      repeating-linear-gradient(to bottom, transparent 0, transparent calc(var(--line) - 1px), var(--rule) calc(var(--line) - 1px), var(--rule) var(--line));
    background-position: 0 0, 0 35px;
    background-attachment: scroll, local;
    scrollbar-width: thin; scrollbar-color: #cbd5df transparent;
  }
  textarea::placeholder { color: #9aa6b2; font-style: italic; }
  .page:focus-within { box-shadow: inset 3px 0 0 var(--ink); }

  .actions { display: flex; align-items: center; gap: 16px; margin-top: 20px; max-width: calc(100% - 300px); }
  .count { color: var(--ink-soft); font-size: 14px; font-variant-numeric: tabular-nums; }
  button {
    margin-left: auto;
    font: 600 15px var(--sans); color: #fff; background: var(--ink);
    border: 0; border-radius: 999px; padding: 11px 22px; cursor: pointer;
  }
  button:hover { background: #2c3d50; }
  button:focus-visible { outline: 3px solid var(--pen); outline-offset: 3px; }
  button:disabled { background: #a7b2be; cursor: default; }

  .margin { padding: 36px 28px 28px; display: flex; flex-direction: column; }
  .empty { color: var(--ink-soft); font-size: 14px; margin: 0; max-width: 24ch; }
  .result[hidden], .empty[hidden] { display: none; }

  .mark { position: relative; width: 150px; height: 128px; margin: -6px 0 6px -10px; }
  .mark .num {
    position: absolute; left: 32px; top: 4px;
    font: 112px/1 var(--hand); color: var(--pen);
  }
  .mark .of { position: absolute; left: 92px; top: 62px; font: 34px/1 var(--hand); color: var(--pen); }
  .mark svg { position: absolute; inset: 0; overflow: visible; }
  .mark path { fill: none; stroke: var(--pen); stroke-width: 3; stroke-linecap: round; }

  .scale { display: flex; gap: 6px; margin: 2px 0 22px; }
  .scale span {
    position: relative; width: 30px; height: 30px; display: grid; place-items: center;
    font: 500 13px var(--sans); color: var(--ink-soft); font-variant-numeric: tabular-nums;
  }
  .scale span.on { color: var(--pen); font-weight: 600; }
  .scale span.on::after {
    content: ""; position: absolute; inset: 2px; border: 2px solid var(--pen); border-radius: 50%;
    transform: rotate(-8deg) scale(1.08, .96);
  }
  .why-head { font-size: 13px; font-weight: 600; color: var(--ink-soft); margin: 0 0 6px; }
  .why { font: 15.5px/1.55 var(--serif); margin: 0; }
  .error { color: var(--pen); font-size: 14px; margin: 14px 0 0; }

  @keyframes draw { from { stroke-dashoffset: var(--len); } to { stroke-dashoffset: 0; } }
  @keyframes ink { from { opacity: 0; } to { opacity: 1; } }
  .result.play .num, .result.play .of { animation: ink .35s ease-out both; }
  .result.play path { stroke-dasharray: var(--len); animation: draw .7s .25s cubic-bezier(.6, 0, .3, 1) both; }
  .result.play .scale, .result.play .why-wrap { animation: ink .4s .8s ease-out both; }
  @media (prefers-reduced-motion: reduce) {
    .result.play * { animation: none !important; }
  }

  footer { margin-top: 26px; font-size: 13px; color: var(--ink-soft); }

  @media (max-width: 820px) {
    .wrap { padding: 28px 16px 48px; }
    h1 { font-size: 44px; }
    .sheet { grid-template-columns: 1fr; }
    .page { border-right: 0; border-bottom: 1px solid #edf1f5; }
    textarea { --margin-x: 40px; padding: 28px 20px 24px 60px; height: calc(var(--line) * 16 + 52px); background-position: 0 0, 0 27px; }
    .actions { max-width: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="intro">
      <h1>LLM Essay Grader</h1>
      <p class="lede">ASAP 2.0 데이터셋에서 사람이 점수를 매긴 영어 에세이를 바탕으로 만든 자동 채점기입니다.</p>
      <details>
        <summary>과제 원문 보기</summary>
        <p id="assignment"></p>
      </details>
    </div>
  </header>

  <main class="sheet">
    <section class="page">
      <textarea id="essay" aria-label="학생 에세이" spellcheck="false" placeholder="학생 에세이를 붙여넣으세요"></textarea>
    </section>

    <aside class="margin" aria-live="polite">
      <p class="empty" id="empty">에세이를 붙여넣고 채점하기를 누르면 이 칸에 점수와 채점 이유가 적힙니다.</p>
      <div class="result" id="result" role="status" hidden>
        <div class="mark" aria-hidden="true">
          <span class="num" id="num"></span><span class="of">/6</span>
          <svg viewBox="0 0 150 128">
            <path id="ring" d="M98 18 C 70 4, 22 14, 14 52 C 6 92, 46 120, 88 114 C 128 108, 146 78, 136 46 C 128 22, 96 10, 70 14 C 60 16, 52 20, 48 24"/>
          </svg>
        </div>
        <div class="scale" id="scale"></div>
        <div class="why-wrap">
          <p class="why-head">채점 이유</p>
          <p class="why" id="why"></p>
        </div>
      </div>
      <p class="error" id="error" hidden></p>
    </aside>
  </main>

  <div class="actions">
    <span class="count" id="count">0단어</span>
    <button id="grade" disabled>채점하기</button>
  </div>

  <footer>채점 모델 Claude Haiku 5.5. 데이터 ASAP 2.0, The Learning Agency, CC BY 4.0.</footer>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  const essay = $("essay"), btn = $("grade"), count = $("count");

  fetch("/api/task").then(r => r.json()).then(d => { $("assignment").textContent = d.assignment; }).catch(() => {});

  const words = () => essay.value.trim() ? essay.value.trim().split(/\s+/).length : 0;
  essay.addEventListener("input", () => {
    const n = words();
    count.textContent = `${n.toLocaleString()}단어`;
    btn.disabled = n < 20;
  });
  essay.addEventListener("keydown", (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter" && !btn.disabled) grade();
  });
  btn.addEventListener("click", grade);

  const ring = $("ring");
  ring.style.setProperty("--len", ring.getTotalLength ? Math.ceil(ring.getTotalLength()) : 420);

  async function grade() {
    btn.disabled = true; btn.textContent = "채점하는 중";
    $("error").hidden = true;
    $("result").hidden = true;
    $("empty").textContent = "채점하는 중입니다.";
    $("empty").hidden = false;
    try {
      const r = await fetch("/api/grade", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ essay: essay.value }) });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || "채점하지 못했습니다.");
      show(d);
    } catch (err) {
      $("error").textContent = err.message; $("error").hidden = false;
    } finally {
      btn.textContent = "다시 채점하기"; btn.disabled = words() < 20;
    }
  }

  function show({ score, rationale }) {
    $("empty").hidden = true;
    const res = $("result");
    $("num").textContent = score;
    res.setAttribute("aria-label", `6점 만점에 ${score}점`);
    $("scale").innerHTML = [1, 2, 3, 4, 5, 6].map(n => `<span class="${n === score ? "on" : ""}">${n}</span>`).join("");
    $("why").textContent = rationale;
    res.hidden = false;
    res.classList.remove("play"); void res.offsetWidth; res.classList.add("play");
  }
</script>
</body>
</html>
